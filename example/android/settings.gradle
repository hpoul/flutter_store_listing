pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '8.13.1' apply false
    // This example predates the current Flutter template, which declares the
    // Kotlin plugin here by default. Without a declaration the Flutter Gradle
    // plugin's version check resolves to the Kotlin that AGP brings along
    // (2.0.0), below its 2.2.20 floor, and the build fails. The check runs
    // against this app whatever its plugins ship, so this is the template
    // catching up rather than a requirement of the Android implementation
    // added alongside it, and consumers need nothing like it.
    id "org.jetbrains.kotlin.android" version '2.3.20' apply false
}

include ":app"
