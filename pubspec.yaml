name: flutter_store_listing
description: Flutter plugin to handle app reviews with the StoreKit review API
  on iOS and macOS, and to generate and open store listings for the App Store,
  the Mac App Store and Google Play.
version: 2.1.0
homepage: https://github.com/hpoul/flutter_store_listing
repository: https://github.com/hpoul/flutter_store_listing
issue_tracker: https://github.com/hpoul/flutter_store_listing/issues

environment:
  # Swift Package Manager support requires the generated `FlutterFramework`
  # Swift package, which Flutter only produces from 3.44.0 on.
  sdk: ^3.10.0
  flutter: ">=3.44.0"

dependencies:
  # No `http`: 2.0 deleted the iTunes `/lookup` call that was its only use, so
  # consumers of a store-listing plugin no longer carry an HTTP client.
  package_info_plus: ">=1.0.3 <11.0.0"
  url_launcher: ">=6.0.2 <7.0.0"
  logging: ">=1.0.0 <2.0.0"
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      # The Android implementation opens the listing with the intent Google
      # documents — the play.google.com URL viewed with the package set to
      # `com.android.vending` — because url_launcher cannot set a package, and
      # the `canLaunchUrl('market://')` probe it replaces could not work
      # without a `<queries>` entry in the consuming app's manifest.
      #
      # It has no Gradle dependencies of its own. In particular Play's in-app
      # review API is deliberately kept out of this package so it stays free of
      # proprietary dependencies (they would otherwise reach F-Droid builds).
      # Android in-app review is meant to live in a separate, opt-in package
      # instead; none is published yet, so do not point users at one.
      android:
        package: design.codeux.flutter_store_listing
        pluginClass: FlutterStoreListingPlugin
      # iOS and macOS share one Swift source tree, one podspec and one
      # Package.swift, all under `darwin/`, which is what `sharedDarwinSource`
      # selects. The two platforms differ in exactly one place — iOS presents
      # the review prompt into a `UIWindowScene` and macOS into an
      # `NSViewController` — and that is a `#if os(macOS)` in one file rather
      # than a second copy of the plugin, or the symlink the alternative layout
      # would need.
      ios:
        pluginClass: FlutterStoreListingPlugin
        sharedDarwinSource: true
      # New in 2.1. 2.0 gave macOS the store listing in Dart, through
      # `url_launcher`, and declared no macOS platform because there was no
      # native code to register. The StoreKit prompt is native, so now there is.
      macos:
        pluginClass: FlutterStoreListingPlugin
        sharedDarwinSource: true

