name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # analysis_options.yaml is committed with the `exclude:` block Flutter's
      # migrator adds, so `pub get` above is a no-op on it and the tree stays
      # clean for the publish dry run below.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Verify the tree is clean after pub get
        run: git diff --exit-code

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Publish dry run
        run: flutter pub publish --dry-run

  build-example-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Compiles the Kotlin through the example app, so the Android plugin
      # cannot break without CI noticing. This also writes
      # example/android/local.properties, which the Gradle run below needs to
      # find the Flutter SDK.
      - name: Build example (Android)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

      # `./gradlew` exists by now even though the example .gitignore keeps it
      # out of the repository: `flutter build` above copies the wrapper from the
      # Flutter cache when it is missing, leaving the committed
      # gradle-wrapper.properties in place. So this honours the same Gradle
      # version as the build, with no second distribution to download.
      #
      # `lintDebug` as well as the unit tests, because the module turns
      # `checkAllWarnings` and `warningsAsErrors` on and a strict lint config
      # nothing ever runs is not a config.
      - name: Test and lint the Android plugin
        working-directory: example/android
        run: >
          ./gradlew --console=plain
          :flutter_store_listing:testDebugUnitTest
          :flutter_store_listing:lintDebug

  build-example-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Builds the Swift sources through the example app, so the iOS plugin
      # cannot break without CI noticing. --no-codesign keeps it key-free.
      - name: Build example (iOS)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --no-codesign --debug

  # Separate from the iOS job even though 2.1 moved both platforms into one
  # `darwin/` source tree — because of that, in fact. The macOS half of the
  # review prompt lives behind `#if os(macOS)`, which an iOS build never
  # compiles, so an iOS-only CI would have gone on passing while the macOS
  # branch failed to build at all.
  build-example-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # No --no-codesign equivalent is needed: the macOS template signs to run
      # locally, which needs no key.
      - name: Build example (macOS)
        working-directory: example
        run: |
          flutter pub get
          flutter build macos --debug
