name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # analysis_options.yaml is committed with the `exclude:` block Flutter's
      # migrator adds, so `pub get` above is a no-op on it and the tree stays
      # clean for the publish dry run below.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Verify the tree is clean after pub get
        run: git diff --exit-code

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Publish dry run
        run: flutter pub publish --dry-run

  build-example-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Compiles the Kotlin through the example app, so the Android plugin
      # cannot break without CI noticing. This also writes
      # example/android/local.properties, which the Gradle run below needs to
      # find the Flutter SDK.
      - name: Build example (Android)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

      # The Flutter example .gitignore keeps `gradlew` and the wrapper jar out
      # of the repository, so there is no wrapper to invoke here and the
      # version is pinned instead of read from gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # `lintDebug` as well as the unit tests, because the module turns
      # `checkAllWarnings` and `warningsAsErrors` on and a strict lint config
      # nothing ever runs is not a config.
      - name: Test and lint the Android plugin
        working-directory: example/android
        run: >
          gradle --console=plain
          :flutter_store_listing:testDebugUnitTest
          :flutter_store_listing:lintDebug

  build-example-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Builds the Swift sources through the example app, so the iOS plugin
      # cannot break without CI noticing. --no-codesign keeps it key-free.
      - name: Build example (iOS)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --no-codesign --debug
